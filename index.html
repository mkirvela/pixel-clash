<script>
'use strict';
// =====================================================================
//  PIXEL CLASH — betting auto-battler. No deps, no build.
// =====================================================================
const rand = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rand(a, b + 1));
const pick = a => a[ri(0, a.length - 1)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const dist = (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay);
const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);

function rarityWeights() { return RARITY.map((r, i) => r.w + (i === 3 ? L().legend : i === 2 ? L().legend / 2 : 0)); }

function ground(g, rgb, from = TD.HZ, tile = 16, shadeAlt = true) { px(g, 0, from, TD.W, TD.H - from, `rgb(${rgb.join(',')})`); for (let y = from; y < TD.H; y += tile) for (let x = 0; x < TD.W; x += tile) { const s = ((x / tile + y / tile) | 0) % 2, d = (y - from) / (TD.H - from); px(g, x, y, tile, tile, `rgb(${rgb[0] + (s ? 6 : 0) + d * 10},${rgb[1] + (s ? 8 : 0) + d * 12},${rgb[2] + (s ? 4 : 0)})`); } px(g, 0, from, TD.W, 2, `rgb(${Math.min(255, rgb[0] + 70)},${Math.min(255, rgb[1] + 70)},${Math.min(255, rgb[2] + 40)})`); }
function scatter(g, n, seed, from, fn) { const r = mulberry(seed); for (let i = 0; i < n; i++) fn(r() * TD.W, from + r() * (TD.H - from), r); }
function bgClouds(g, t, col, seed, y0 = 20, y1 = 60, n = 4) { const r = mulberry(seed); for (let i = 0; i < n; i++) { const w = 40 + r() * 60, y = y0 + r() * (y1 - y0), x = ((r() * TD.W + t * (6 + r() * 10)) % (TD.W + 120)) - 80; g.fillStyle = col; px(g, x, y, w, 8); px(g, x + w * 0.15, y - 5, w * 0.5, 5); px(g, x + w * 0.45, y - 9, w * 0.3, 4); px(g, x + w * 0.1, y + 8, w * 0.8, 3); } }
function castle(g, x, flip, col, h = 40) { const bw = 46, bx = flip ? x - bw : x; px(g, bx, TD.HZ - h, bw, h + 6, col); for (let i = 0; i < 5; i++) px(g, bx + i * 10, TD.HZ - h - 6, 6, 6, col); px(g, bx + (flip ? 4 : bw - 18), TD.HZ - h - 28, 14, 28, col); px(g, bx + (flip ? 2 : bw - 20), TD.HZ - h - 32, 18, 4, col); }
function pines(g, col, base, n, seed, scale = 1) { const r = mulberry(seed); for (let i = 0; i < n; i++) { const x = r() * TD.W, h = (18 + r() * 22) * scale, w = h * 0.5; g.fillStyle = col; g.beginPath(); g.moveTo(x, base - h); g.lineTo(x + w / 2, base); g.lineTo(x - w / 2, base); g.closePath(); g.fill(); px(g, x - 1, base, 2, 3, col); } }
function flag(g, x, y, col, t) { px(g, x, y - 26, 2, 26, '#3f2716'); for (let i = 0; i < 6; i++) px(g, x + 2, y - 25 + i * 3 + Math.sin(t * 6 + i * 0.6) * 1.5, 14 - i, 3, col); }
function crowd(g, y, seed, cols) { const r = mulberry(seed); for (let x = 0; x < TD.W; x += 3) px(g, x, y - r() * 4, 2, 4, cols[Math.floor(r() * cols.length)]); }

    ${mine && !d.evolved ? `<div class="muted" style="margin-top:4px;font-size:10px">${u.level >= 3 ? '✦ can evolve into <b style="color:#ffd700">' + esc(UNIT_TYPES[d.evo].name) + '</b> (see Army panel)' : 'evolves at LV3 into ' + esc(UNIT_TYPES[d.evo].name)}</div>` : ''}`;
  el.hidden = false; el.style.pointerEvents = 'auto';
  const zoom = 1 + zoomPunch * 0.035, sx = (u.x - W / 2) * zoom + W / 2, top = (headY(u) - 14 - H / 2) * zoom + H / 2;
  const r = el.getBoundingClientRect(), w = r.width || 220, h = r.height || 120;
  const below = top - h < 8;
  el.classList.toggle('below', below);
  el.style.left = clamp(sx, w / 2 + 6, W - w / 2 - 6) + 'px';
  el.style.top = (below ? u.y + 14 : top) + 'px';
}
// ---------- debug travel ----------
let debugOpen = false;
function travelToLeague(i) {
  if (phase !== 'prep') { toast('TRAVEL ONLY BETWEEN BATTLES'); return; }
  league = clamp(i, 0, LEAGUES.length - 1); leagueRound = 0; leagueWins = 0; selected = null; targeting = null; oddsLocked = false;
  for (const e of enemyUnits) { const k = units.indexOf(e); if (k >= 0) units.splice(k, 1); }
  pickLeagueTheme(); buildBackground(); generateEnemy(); placeFormations(); scheduleOdds(); rollShop();
  banner(L().name, L().color, { color2: '#fff', scale: S * 2.4, life: 1.4, sub: 'DEBUG TRAVEL · ENEMIES RESCALED', subColor: '#fff' });
  openMerchant();
}
function renderDebug() {
  UI.debug.hidden = !debugOpen; if (!debugOpen) return;
  const th = currentTheme();
  UI.debug.innerHTML = `<div class="row"><h3 style="margin:0">DEBUG</h3><button id="dbgclose" style="padding:3px 8px;font-size:10px">X</button></div>
    <div class="muted" style="margin-top:6px">LEAGUE</div><select id="dbgleague">${LEAGUES.map((l, i) => `<option value="${i}" ${i === league ? 'selected' : ''}>${i + 1}. ${l.name} (${l.tier})</option>`).join('')}</select>
    <div class="muted">BACKDROP <span style="color:#ffd93b">${esc(th.name)}</span> ${debugTheme ? '<span style="color:#ff9a8e">(override)</span>' : '<span class="muted">(this league)</span>'}</div>
    <select id="dbgtheme"><option value="">— league default —</option>${THEMES.map(t => `<option value="${t.id}" ${debugTheme === t.id ? 'selected' : ''}>${t.name}</option>`).join('')}</select>
    <div class="row" style="margin-top:6px;flex-wrap:wrap;gap:4px"><button id="dbggold" style="padding:4px 8px;font-size:10px">+$1000</button><button id="dbgwins" style="padding:4px 8px;font-size:10px">+WINS</button><button id="dbgitems" style="padding:4px 8px;font-size:10px">FILL BAG</button><button id="dbgstart" style="padding:4px 8px;font-size:10px">RESTART</button></div>
    <div class="muted" style="font-size:10px;margin-top:6px">round ${round} · league round ${leagueRound} · handicap x${enemyHandicap.toFixed(2)} · phase ${phase} · toggle: tap the title 5x or Shift+D</div>`;
  $('dbgclose').onclick = () => { debugOpen = false; renderDebug(); };
  $('dbgleague').onchange = e => travelToLeague(+e.target.value);
  $('dbgtheme').onchange = e => { debugTheme = e.target.value || null; buildBackground(); renderDebug(); };
  $('dbggold').onclick = () => { gold += 1000; peakGold = Math.max(peakGold, gold); awardGold(1000, W / 2, H * 0.4); renderUI(); };
  $('dbgwins').onclick = () => { leagueWins = L().winsReq === Infinity ? leagueWins : L().winsReq; renderUI(); };
  $('dbgitems').onclick = () => { while (inventory.length < invMax()) inventory.push(pick(CONSUMABLES)); renderInv(true); };
  $('dbgstart').onclick = () => { restartGame(); renderDebug(); };
}
$('dbgbtn').onclick = () => { debugOpen = !debugOpen; renderDebug(); };
function setMuted(v) { muted = v; try { localStorage.setItem('pixelclash_mute', v ? '1' : '0'); } catch (e) {} const b = $('mutetop'); if (b) b.textContent = muted ? '🔇' : '🔊'; }
$('mutetop').onclick = () => { audioInit(); setMuted(!muted); renderUI(); };
setMuted(muted);
function renderBattleBar() { const mods = rolledMods.map(m => `<span class="modchip" style="color:${m.color};border-color:${m.color}" data-tip="<b>${esc(m.def.name)}</b> · ${m.who}<br>${esc(m.def.desc)}">${esc(m.def.name)}${m.team === 0 ? ' ▲' : m.team === 1 ? ' ▼' : ''}</span>`).join(' '); UI.battlebar.innerHTML = (mods ? `<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;margin-right:8px"><span class="muted" style="font-size:10px">MODS</span>${mods}</div>` : '') + `<button id="statsbtn" class="${statsOpen ? 'sel' : ''}">STATS</button><button id="spd">SPEED x${speed}</button><button id="mutebtn">${muted ? '🔇' : '🔊'}</button>`; $('statsbtn').onclick = () => { statsOpen = !statsOpen; renderUI(); }; $('spd').onclick = () => { speed = speed === 1 ? 2 : speed === 2 ? 3 : 1; renderBattleBar(); }; $('mutebtn').onclick = () => { setMuted(!muted); renderBattleBar(); }; }
function renderUI() {
  const prep = phase === 'prep', merchant = phase === 'merchant', dicePhase = phase === 'dice', battle = phase === 'battle' || phase === 'ending', result = phase === 'result' && !(lastResult && lastResult.busted), over = phase === 'result' && lastResult && lastResult.busted;
  if (codexOpen && tab !== 'codex' && MOBILE && prep) tab = 'codex';
  if (lbOpen && tab !== 'boards' && MOBILE && prep) tab = 'boards';
  if (MOBILE && prep) { UI.left.hidden = tab !== 'army'; UI.shop.hidden = tab !== 'shop'; UI.right.hidden = tab !== 'bet'; codexOpen = tab === 'codex'; lbOpen = tab === 'boards'; }
  else { UI.left.hidden = !prep; UI.right.hidden = !prep; UI.shop.hidden = !prep; }
  UI.dicebox.hidden = !dicePhase || rolledMods.length === 0; if (dicePhase) renderDiceBox();
  renderMerchant();
  UI.battlebar.hidden = !battle; UI.result.hidden = !result || lbOpen; UI.gameover.hidden = !over || lbOpen; UI.stats.hidden = !statsOpen; UI.codex.hidden = !codexOpen; UI.lb.hidden = !lbOpen;
  if (!codexOpen) previews.clear();
  const tabs = $('tabs'); tabs.style.display = MOBILE && prep ? 'flex' : 'none';
  document.body.classList.toggle('tabs', MOBILE && prep); document.body.classList.toggle('prep', prep);
  if (MOBILE && prep) tabs.querySelectorAll('button').forEach(b => b.classList.toggle('sel', b.dataset.tab === tab));
  if (prep) { renderShop(); renderBet(); renderUnitPanel(); }
  if (battle) renderBattleBar();
  if (result) renderResult();
  if (over) renderGameOver();
  if (statsOpen) renderStats();
  if (codexOpen) renderCodex();
  if (lbOpen) renderLB();
  renderHeroCard(); renderInv(); renderDebug();
}
// ---------- input ----------
canvas.addEventListener('pointermove', e => { aimPos = { x: e.clientX, y: e.clientY }; });
const overField = (x, y) => x > 0 && x < W && y > FIELD_TOP - 60 && y < FIELD_BOTTOM + 40;
window.addEventListener('pointermove', e => { if (!drag) return; drag.x = e.clientX; drag.y = e.clientY; if (Math.hypot(drag.x - drag.x0, drag.y - drag.y0) > 8) drag.moved = true; });
window.addEventListener('pointerup', e => {
  if (!drag) return; const d = drag; drag = null; d.el.classList.remove('dragging');
  if (phase !== 'battle') return;
  if (!d.moved) { useSlot(d.i); return; } // tap shortcut
  if (overField(d.x, d.y)) useSlot(d.i, d.item.aim ? { x: clamp(d.x, 30, W - 30), y: clamp(d.y, FIELD_TOP - 20, FIELD_BOTTOM + 20) } : undefined);
  else { smoke(d.x, d.y, 6, '#6a6070'); toast('CANCELLED'); renderInv(); }
});
window.addEventListener('pointercancel', () => { if (drag) { drag.el.classList.remove('dragging'); drag = null; } });
let titleTaps = 0, titleTapT = 0;
canvas.addEventListener('pointerdown', e => {
  audioInit();
  if (e.clientY < 40 && Math.abs(e.clientX - W / 2) < 120) { if (realTime - titleTapT > 1.5) titleTaps = 0; titleTaps++; titleTapT = realTime; if (titleTaps >= 5) { titleTaps = 0; debugOpen = !debugOpen; renderDebug(); toast(debugOpen ? 'DEBUG MENU' : 'DEBUG OFF'); return; } }
  if (phase === 'vs') { launchBattle(); return; }
  if (phase === 'battle') {
    const mx = e.clientX, my = e.clientY; aimPos = { x: mx, y: my };
    if (useAim) { useSlot(useAim.i, { x: clamp(mx, 30, W - 30), y: clamp(my, FIELD_TOP - 20, FIELD_BOTTOM + 20) }); return; }
    for (const c of chests) if (c.state === 'closed' && Math.abs(mx - c.x) < 40 && my > c.y - 70 && my < c.y + 20) { openChest(c, true); return; }
    return;
  }
  if (phase !== 'prep') return;
  const mx = e.clientX, my = e.clientY;
  let hit = null, bd = 1e9;
  for (const u of units) { const w = unitW(u), h = unitH(u); if (mx > u.x - w / 2 - 6 && mx < u.x + w / 2 + 6 && my > u.y - h - 10 && my < u.y + 8) { const d = dist(mx, my, u.x, u.y - h / 2); if (d < bd) { bd = d; hit = u; } } }
  if (targeting) { if (hit && hit.team.id === 0) applyCardTo(hit); else { toast('PICK ONE OF YOUR UNITS (ESC TO CANCEL)'); } return; }
  selected = hit; renderUI(); if (hit) SFX.buy();
});
$('tabs').querySelectorAll('button').forEach(b => b.addEventListener('click', () => { tab = b.dataset.tab; codexOpen = tab === 'codex'; lbOpen = tab === 'boards'; renderUI(); }));
window.addEventListener('keydown', e => {
  if (e.code === 'Tab') { e.preventDefault(); if (phase !== 'prep') { statsOpen = !statsOpen; renderUI(); } }
  else if (e.code === 'Backquote' || (e.shiftKey && e.code === 'KeyD')) { debugOpen = !debugOpen; renderDebug(); }
  else if (e.code === 'Escape') { targeting = null; selected = null; codexOpen = false; lbOpen = false; debugOpen = false; renderDebug(); if (useAim) { useAim = null; renderInv(); } renderUI(); }
  else if (/^Digit[1-4]$/.test(e.code) && phase === 'battle') useSlot(+e.code[5] - 1);
  else if (e.key === 'm' || e.key === 'M') { setMuted(!muted); renderUI(); }
  else if (e.code === 'Enter' && phase === 'prep') startBattle();
  else if ((e.code === 'Enter' || e.code === 'Space') && phase === 'dice' && rolledMods.length === dice.length && dice.length) { e.preventDefault(); beginBattle(); }
  else if ((e.code === 'Enter' || e.code === 'Space') && phase === 'vs') { e.preventDefault(); launchBattle(); }
  else if (e.code === 'Enter' && phase === 'result') nextRound();
});
window.addEventListener('pointerdown', () => audioInit(), { once: true });

// ---------- loop & init ----------
let last = performance.now();
function frame(now) { let dt = (now - last) / 1000; last = now; dt = Math.min(dt, 0.05); update(dt); paintBackground(realTime); render(); if (phase === 'prep' && !UI.right.hidden) drawBookie(); if (phase === 'merchant') drawPeddler(); if (codexOpen) updatePreviews(dt); if (phase === 'prep') stepSims(10); requestAnimationFrame(frame); }
resize();
for (const t of ['knight', 'knight', 'archer', 'mage']) roster.push(spawnUnit(0, t, W * 0.25, H / 2, false));
startPrep();
banner('PIXEL CLASH', '#ffd93b', { color2: '#fff', scale: S * 3, life: 2.2, sub: 'BUILD YOUR ARMY. PLACE YOUR BET. WATCH IT BURN.', subColor: '#fff' });
requestAnimationFrame(frame);
</script>
